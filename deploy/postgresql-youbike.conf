# YouBike D1：PostgreSQL 16 設定（e2-micro，1 GB RAM）
# 安裝到 /etc/postgresql/16/main/conf.d/youbike.conf（擁有者 root、權限 644），再重新啟動 PostgreSQL：
#   sudo install -m 644 -o root -g root deploy/postgresql-youbike.conf /etc/postgresql/16/main/conf.d/youbike.conf
#   sudo systemctl restart postgresql
# Ubuntu 的 postgresql.conf 預設有 include_dir = 'conf.d'，這裡的設定會覆蓋預設值。

# 不開 TCP，只接受本機 Unix socket（/var/run/postgresql）連線。
# 4C 與之後的 API 都在同一台 VM，以 peer 驗證連線，不需要密碼，也不需要 5432 port。
listen_addresses = ''

# 預設 100。目前只有 4C 一條連線，加上 API 也遠低於 20；調低可減少每條連線預留的記憶體。
max_connections = 20

# 預設值，明寫出來方便日後調整。實際記憶體影響以 D1-a 驗收實測為準。
shared_buffers = 128MB
