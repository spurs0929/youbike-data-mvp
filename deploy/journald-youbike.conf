# systemd-journald 上限：安裝到 /etc/systemd/journald.conf.d/youbike.conf
#   sudo install -D -m 644 deploy/journald-youbike.conf /etc/systemd/journald.conf.d/youbike.conf
#   sudo systemctl restart systemd-journald
#
# 系統日誌（cron、sshd、kernel 等）最多保留 14 天、最多佔 200 MB 磁碟，
# 避免 30 GB 的 e2-micro 磁碟被系統日誌吃掉。不影響 YouBike 的資料檔。

[Journal]
SystemMaxUse=200M
MaxRetentionSec=14day
